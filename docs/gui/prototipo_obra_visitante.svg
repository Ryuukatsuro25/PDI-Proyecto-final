    <rect x="44" y="842" width="160" height="96" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><text x="54" y="860" font-weight="700">Clasificación</text><text x="54" y="878" fill="#6B7190">Positiva / Negativa</text><text x="54" y="894" fill="#6B7190">logits · tensor · tamaño</text>
    <rect x="212" y="842" width="160" height="96" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><text x="222" y="860" font-weight="700">Paleta</text>
    <rect x="222" y="870" width="22" height="14" fill="#283078"/><rect x="246" y="870" width="22" height="14" fill="#8E5A3A"/><rect x="270" y="870" width="22" height="14" fill="#C9B79C"/><rect x="294" y="870" width="22" height="14" fill="#3D5A40"/>
    <rect x="380" y="842" width="160" height="96" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><text x="390" y="860" font-weight="700">Emociones (8)</text>
    <rect x="390" y="870" width="120" height="6" fill="#9AA0B4"/><rect x="390" y="882" width="60" height="6" fill="#2A78D6"/><rect x="390" y="894" width="30" height="6" fill="#EDA100"/>
    <rect x="548" y="842" width="168" height="96" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><text x="558" y="860" font-weight="700">Línea de tiempo y tiempos</text><text x="558" y="878" fill="#6B7190">ms por módulo</text>
