<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="980" fill="#F3F4F8"/>
  <text x="24" y="34" font-size="11" fill="#6B7190" letter-spacing="1">PROTOTIPO DE BAJA FIDELIDAD · FLUJO «DATOS, ANÁLISIS Y PREDICCIÓN»</text>
  <text x="24" y="62" font-size="20" font-weight="700" fill="#232B5D">Expresión humana en el arte</text>
  <rect x="24" y="80" width="200" height="34" rx="6" fill="none" stroke="#C9CCDA"/>
  <text x="36" y="102" font-size="12" fill="#6B7190">Obra y visitante</text>
  <rect x="232" y="80" width="230" height="34" rx="6" fill="#fff" stroke="#232B5D" stroke-width="1.5"/>
  <text x="244" y="102" font-size="12" font-weight="700" fill="#232B5D">Datos, análisis y predicción</text>

  <!-- 1 Fuente -->
  <rect x="24" y="130" width="712" height="220" rx="10" fill="#fff" stroke="#C9CCDA"/>
  <text x="44" y="156" font-size="14" font-weight="700" fill="#232B5D">1 · Fuente de datos</text>
  <g font-size="11" fill="#232B5D">
    <circle cx="52" cy="178" r="5" fill="#232B5D"/><text x="62" y="182">Carpeta local</text>
    <circle cx="162" cy="178" r="5" fill="none" stroke="#232B5D"/><text x="172" y="182">Google Drive</text>
  </g>
  <rect x="44" y="192" width="520" height="26" rx="5" fill="#F6F7FB" stroke="#C9CCDA"/>
  <text x="54" y="209" font-size="10" fill="#9AA0B4">/content/drive/MyDrive/Proyecto Final PDI VERSION 3/dataset usado</text>
  <rect x="576" y="192" width="140" height="26" rx="5" fill="#232B5D"/>
  <text x="646" y="209" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">Cargar y validar</text>
  <g font-size="10" fill="#232B5D">
    <rect x="44" y="232" width="214" height="62" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><text x="56" y="252" font-weight="700">positivo</text><text x="56" y="270">400 válidas · 0 descartadas</text>
    <rect x="270" y="232" width="214" height="62" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><text x="282" y="252" font-weight="700">negativo</text><text x="282" y="270">400 válidas · 0 descartadas</text>
    <rect x="496" y="232" width="220" height="62" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><text x="508" y="252" font-weight="700">precargadas</text><text x="508" y="270">300 válidas · 0 descartadas</text>
  </g>
  <rect x="44" y="306" width="672" height="30" rx="6" fill="#EEF0F8"/>
  <text x="56" y="325" font-size="10" fill="#232B5D">Reentrenar la CNN con estos datos (partición 80/10/10) · modelo activo: accuracy y F1</text>
  <rect x="610" y="310" width="98" height="22" rx="5" fill="#fff" stroke="#232B5D"/>
  <text x="659" y="325" font-size="10" text-anchor="middle" fill="#232B5D">Reentrenar</text>

  <!-- 2 Precargadas -->
  <rect x="24" y="366" width="712" height="250" rx="10" fill="#fff" stroke="#C9CCDA"/>
  <text x="44" y="392" font-size="14" font-weight="700" fill="#232B5D">2 · Análisis de imágenes precargadas</text>
  <g font-size="10">
    <rect x="44" y="404" width="170" height="22" rx="5" fill="#232B5D"/><text x="129" y="419" text-anchor="middle" fill="#fff">Mostrar precargadas al azar</text>
    <rect x="222" y="404" width="96" height="22" rx="5" fill="#fff" stroke="#232B5D"/><text x="270" y="419" text-anchor="middle" fill="#232B5D">Analizar todas</text>
    <rect x="326" y="404" width="150" height="22" rx="5" fill="#fff" stroke="#232B5D"/><text x="401" y="419" text-anchor="middle" fill="#232B5D">Analizar una imagen propia</text>
    <rect x="484" y="404" width="190" height="22" rx="5" fill="#fff" stroke="#232B5D"/><text x="579" y="419" text-anchor="middle" fill="#232B5D">Agrupar precargadas (no superv.)</text>
  </g>
  <g font-size="9" fill="#232B5D">
    <rect x="44" y="438" width="104" height="150" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><rect x="52" y="446" width="88" height="70" fill="#DDE1EE"/><text x="52" y="532" font-weight="700">Positiva 71 %</text><text x="52" y="546">1 rostro · neutral</text><text x="52" y="560">coherencia media</text>
    <rect x="156" y="438" width="104" height="150" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><rect x="164" y="446" width="88" height="70" fill="#DDE1EE"/><text x="164" y="532" font-weight="700">Negativa 88 %</text><text x="164" y="546">sin rostro</text>
    <rect x="268" y="438" width="104" height="150" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><rect x="276" y="446" width="88" height="70" fill="#DDE1EE"/><text x="276" y="532" font-weight="700">Positiva 64 %</text><text x="276" y="546">2 rostros</text>
    <rect x="380" y="438" width="104" height="150" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><rect x="388" y="446" width="88" height="70" fill="#DDE1EE"/><text x="388" y="532" font-weight="700">Negativa 55 %</text><text x="388" y="546">⚠ revisión</text>
    <rect x="492" y="438" width="224" height="150" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/><text x="502" y="456" font-weight="700">Agrupamiento (PCA)</text>
    <circle cx="540" cy="500" r="4" fill="#2A78D6"/><circle cx="552" cy="512" r="4" fill="#2A78D6"/><circle cx="530" cy="520" r="4" fill="#2A78D6"/><circle cx="620" cy="540" r="4" fill="#EB6834"/><circle cx="640" cy="528" r="4" fill="#EB6834"/><circle cx="660" cy="552" r="4" fill="#EB6834"/>
    <text x="502" y="578">k por silueta · obras representativas</text>
  </g>

  <!-- 3 Predicción -->
  <rect x="24" y="632" width="712" height="326" rx="10" fill="#fff" stroke="#C9CCDA"/>
  <text x="44" y="658" font-size="14" font-weight="700" fill="#232B5D">3 · Predicción sobre una imagen nueva</text>
  <rect x="44" y="672" width="320" height="120" rx="8" fill="#EEF0F8" stroke="#6B7190" stroke-dasharray="6 5"/>
  <text x="204" y="728" font-size="12" text-anchor="middle" fill="#232B5D" font-weight="700">Arrastra una imagen aquí</text>
  <text x="204" y="746" font-size="10" text-anchor="middle" fill="#6B7190">JPG o PNG, hasta 10 MB</text>
  <rect x="380" y="672" width="336" height="190" rx="8" fill="#F6F7FB" stroke="#C9CCDA"/>
  <text x="396" y="700" font-size="18" font-weight="700" fill="#EB6834">No neutral</text>
  <text x="510" y="700" font-size="11" fill="#6B7190">confianza 72 %</text>
  <rect x="396" y="712" width="300" height="8" rx="4" fill="#C9CCDA"/><rect x="396" y="712" width="84" height="8" rx="4" fill="#2F9E6A"/>
  <line x1="606" y1="708" x2="606" y2="724" stroke="#232B5D" stroke-width="2"/>
  <text x="396" y="738" font-size="9" fill="#6B7190">0 % no neutral · P(neutral) = 28 % · τ = 70 % · 100 % neutral</text>
  <text x="396" y="762" font-size="11" fill="#232B5D">Emoción no neutral más probable: Felicidad</text>
  <text x="396" y="786" font-size="11" fill="#232B5D">Varios rostros: tabla con cada uno</text>
  <text x="396" y="810" font-size="11" fill="#232B5D">Categoría de la obra (CNN): Positiva · 77 %</text>
  <rect x="44" y="804" width="320" height="58" rx="6" fill="#2A2F45"/>
  <rect x="170" y="812" width="40" height="42" rx="3" fill="none" stroke="#EB6834" stroke-width="2"/>
  <text x="176" y="826" font-size="8" fill="#fff">#1</text>
  <rect x="44" y="876" width="672" height="66" rx="6" fill="#EEF0F8"/>
  <text x="56" y="896" font-size="11" font-weight="700" fill="#232B5D">Umbral de neutralidad</text>
  <text x="56" y="914" font-size="10" fill="#232B5D">Fotos del equipo: 20 neutrales y 20 no neutrales (mínimo 10 por clase)</text>
  <text x="56" y="930" font-size="10" fill="#6B7190">Umbral activo τ, recorte elegido, AUC y exactitud balanceada</text>
  <rect x="560" y="896" width="144" height="24" rx="5" fill="#fff" stroke="#232B5D"/>
  <text x="632" y="912" font-size="10" text-anchor="middle" fill="#232B5D">Calibrar umbral</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
