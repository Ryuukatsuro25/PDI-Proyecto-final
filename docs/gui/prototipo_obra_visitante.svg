<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="980" fill="#F3F4F8"/>
  <text x="24" y="34" font-size="11" fill="#6B7190" letter-spacing="1">PROTOTIPO DE BAJA FIDELIDAD · FLUJO «OBRA Y VISITANTE»</text>
  <text x="24" y="62" font-size="20" font-weight="700" fill="#232B5D">Expresión humana en el arte</text>
  <g font-size="10" fill="#232B5D">
    <rect x="520" y="44" width="70" height="22" rx="11" fill="#fff" stroke="#C9CCDA"/><text x="531" y="59">● CNN</text>
    <rect x="596" y="44" width="70" height="22" rx="11" fill="#fff" stroke="#C9CCDA"/><text x="606" y="59">● Rostro</text>
    <rect x="672" y="44" width="64" height="22" rx="11" fill="#fff" stroke="#C9CCDA"/><text x="683" y="59">● FER+</text>
  </g>
  <rect x="24" y="80" width="200" height="34" rx="6" fill="#fff" stroke="#232B5D" stroke-width="1.5"/>
  <text x="36" y="102" font-size="12" font-weight="700" fill="#232B5D">Obra y visitante</text>
  <rect x="232" y="80" width="230" height="34" rx="6" fill="none" stroke="#C9CCDA"/>
  <text x="244" y="102" font-size="12" fill="#6B7190">Datos, análisis y predicción</text>
  <g font-size="11">
    <rect x="24" y="128" width="172" height="40" rx="6" fill="#232B5D"/><text x="36" y="152" fill="#fff" font-weight="700">1 · Entrada</text>
    <rect x="204" y="128" width="172" height="40" rx="6" fill="#fff" stroke="#C9CCDA"/><text x="216" y="152" fill="#232B5D">2 · Análisis</text>
    <rect x="384" y="128" width="172" height="40" rx="6" fill="#fff" stroke="#C9CCDA"/><text x="396" y="152" fill="#232B5D">3 · Excepciones</text>
    <rect x="564" y="128" width="172" height="40" rx="6" fill="#fff" stroke="#C9CCDA"/><text x="576" y="152" fill="#232B5D">4 · Resultado</text>
  </g>

  <!-- Paso 1 -->
  <rect x="24" y="184" width="712" height="270" rx="10" fill="#fff" stroke="#C9CCDA"/>
  <text x="44" y="210" font-size="14" font-weight="700" fill="#232B5D">Paso 1 · Entrada</text>
  <rect x="44" y="224" width="320" height="150" rx="8" fill="#EEF0F8" stroke="#6B7190" stroke-dasharray="6 5"/>
  <text x="204" y="292" font-size="12" text-anchor="middle" fill="#232B5D" font-weight="700">Arrastra la obra aquí</text>
  <text x="204" y="310" font-size="10" text-anchor="middle" fill="#6B7190">JPG o PNG, hasta 10 MB</text>
  <rect x="396" y="224" width="320" height="150" rx="8" fill="#2A2F45"/>
  <circle cx="556" cy="290" r="26" fill="none" stroke="#9AA0B4" stroke-width="2"/>
