  <text x="144" y="760" font-size="10" text-anchor="middle" fill="#232B5D">Obra + Grad-CAM / regiones</text>
  <text x="144" y="824" font-size="12" text-anchor="middle" fill="#232B5D" font-weight="700">Negativa · 82 %</text>
  <path d="M 300 760 A 80 80 0 0 1 460 760" fill="none" stroke="#C9CCDA" stroke-width="14"/>
  <path d="M 300 760 A 80 80 0 0 1 400 686" fill="none" stroke="#232B5D" stroke-width="14"/>
  <text x="380" y="756" font-size="18" text-anchor="middle" fill="#232B5D" font-weight="700">64 %</text>
  <text x="380" y="782" font-size="10" text-anchor="middle" fill="#6B7190">Coincidencia emocional</text>
  <rect x="300" y="796" width="160" height="6" rx="3" fill="#C9CCDA"/>
  <text x="380" y="818" font-size="9" text-anchor="middle" fill="#6B7190">−1 desagradable · valencia · agradable +1</text>
  <rect x="516" y="656" width="200" height="150" rx="6" fill="#2A2F45"/>
  <rect x="586" y="690" width="60" height="70" rx="4" fill="none" stroke="#2F9E6A" stroke-width="2"/>
  <text x="616" y="824" font-size="12" text-anchor="middle" fill="#232B5D" font-weight="700">Neutral · Tristeza 31 %</text>
