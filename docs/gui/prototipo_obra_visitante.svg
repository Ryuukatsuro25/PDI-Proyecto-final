  <rect x="44" y="384" width="320" height="18" rx="3" fill="#EEF0F8"/>
  <text x="52" y="397" font-size="10" fill="#6B7190">☐ Autorizo el uso de la cámara (consentimiento)</text>
  <rect x="396" y="384" width="320" height="36" rx="6" fill="#F6F7FB" stroke="#C9CCDA"/>
  <text x="406" y="398" font-size="9" fill="#6B7190">En vivo: emoción · rostro · neutralidad · calificación · luz</text>
  <text x="406" y="413" font-size="9" fill="#6B7190">[Guardar como neutral] [Guardar como no neutral]</text>
  <rect x="560" y="428" width="156" height="20" rx="5" fill="#232B5D"/>
  <text x="638" y="442" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">Confirmar y analizar</text>
  <rect x="44" y="428" width="110" height="20" rx="5" fill="#fff" stroke="#232B5D"/>
  <text x="99" y="442" font-size="10" text-anchor="middle" fill="#232B5D">Activar cámara</text>
  <rect x="162" y="428" width="122" height="20" rx="5" fill="#fff" stroke="#232B5D"/>
  <text x="223" y="442" font-size="10" text-anchor="middle" fill="#232B5D">Iniciar observación</text>

  <!-- Paso 3 -->
  <rect x="24" y="470" width="712" height="130" rx="10" fill="#fff" stroke="#C9CCDA"/>
  <text x="44" y="496" font-size="14" font-weight="700" fill="#232B5D">Paso 3 · Excepciones</text>
  <g font-size="10">
    <rect x="44" y="508" width="672" height="22" rx="4" fill="#FFF4E5"/><text x="54" y="523" fill="#8A5300">⚠ Calidad insuficiente · La imagen de la cámara está muy oscura (brillo 38/255). Mejora la iluminación.</text>
    <rect x="44" y="534" width="672" height="22" rx="4" fill="#FDECEC"/><text x="54" y="549" fill="#8E1F1F">✖ Rostro no detectado · Ajusta la posición: la persona debe estar de frente y dentro del cuadro.</text>
    <rect x="44" y="560" width="672" height="22" rx="4" fill="#EAF2FD"/><text x="54" y="575" fill="#1F4E8E">ℹ Varios rostros · Se clasifica cada uno por separado; el principal es el más grande.</text>
  </g>
  <rect x="470" y="584" width="120" height="0" fill="none"/>

  <!-- Paso 4 -->
  <rect x="24" y="616" width="712" height="340" rx="10" fill="#fff" stroke="#C9CCDA"/>
